name: Update HISTORY on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-history:
    if: startsWith(github.event.release.tag_name, 'moors-') || startsWith(github.event.release.tag_name, 'pymoors-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update HISTORY files
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DATE="$(date -u +%F)"
          BODY_FILE="release_body.md"
          printf "%s" "${{ github.event.release.body }}" > "$BODY_FILE"

          if [[ "$TAG" == moors-* ]]; then
            HISTORY_PATH="moors/HISTORY.md"
          else
            HISTORY_PATH="pymoors/HISTORY.md"
          fi

          # Prepend section to HISTORY
          HEADER="## [$TAG] - $DATE"
          TMP=".tmp_history.md"
          {
            echo "$HEADER"
            echo
            cat "$BODY_FILE"
            echo
            echo
            if [[ -f "$HISTORY_PATH" ]]; then cat "$HISTORY_PATH"; fi
          } > "$TMP"
          mkdir -p "$(dirname "$HISTORY_PATH")"
          mv "$TMP" "$HISTORY_PATH"

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == moors-* ]]; then
            git add moors/HISTORY.md
          else
            git add pymoors/HISTORY.md
          fi

          git commit -m "docs(history): update from release ${{ github.event.release.tag_name }}" || echo "No changes"
          git push
